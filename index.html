pv=function(){if(!$("#pv"))return;const c=pesCalc();$("#pnet").textContent=f(c.n0)+" kg";$("#pv").innerHTML=`Après refus : <b>${f(c.net)} kg</b> · valeur : <b>${f(c.val)} F</b> · remboursement crédit : <b>${c.ret?f(c.ret)+" F":"aucun"}</b> · net à payer : <b>${f(c.val-c.ret-c.ex)} F</b>`};
const _rd=render;render=function(){rebuildG();tot.r=G.reduce((t,g)=>t+g[2],0);tot.l=G.reduce((t,g)=>t+g[3],0);_rd();$("#sb").className="sb"+(sbc?" cl":"")+(sbo?" open":"");$("#top").insertAdjacentHTML("afterbegin",'<button class="b s z" data-a="sbt" aria-label="Plier ou déplier le menu">☰</button>')};
document.addEventListener("change",e=>{const t=e.target;if(t.id==="py"){py=t.value;render()}if(t.id==="ag"){ag=+t.value;render()}if(t.id==="dv"){drv=+t.value;render()}if(t.id==="trph"&&t.files[0]){const r=new FileReader();r.onload=()=>{TRC.ph=r.result;trM()};r.readAsDataURL(t.files[0])}});

document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&X[t.dataset.a])X[t.dataset.a](t.dataset.v,t,e)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("tr[data-a]"))e.target.click();if(e.key==="Escape"){M("");if(dp!==null){dp=null;render()}}});
document.addEventListener("input",e=>{const id=e.target.id||"";if(id==="q"){q=e.target.value;$("#tb").innerHTML=ptb()}if(["pk","pr","pm","pt","px","pe"].includes(id))pv()});
document.addEventListener("change",e=>{if(e.target.id==="rl"){role=e.target.value;view=R[role][2];dp=null;M("");render()}if(e.target.id==="pf"){pf=e.target.value;render()}});
Object.assign(X,{
tfs:v=>{tfs=v;tfp=1;render()},tpg:v=>{tfp+=+v;$("#tfr").innerHTML=tfBody()},
tsel:v=>{v=+v;TFS.has(v)?TFS.delete(v):TFS.add(v);$("#tfr").innerHTML=tfBody()},
tsall:()=>{const L=tfList().slice((tfp-1)*TFN,tfp*TFN).map(([,i])=>i),all=L.every(i=>TFS.has(i));L.forEach(i=>all?TFS.delete(i):TFS.add(i));$("#tfr").innerHTML=tfBody()},
tfclr:()=>{TFS.clear();$("#tfr").innerHTML=tfBody()},
tfadv:()=>{let n=0;[...TFS].forEach(i=>{const x=PARC[i],a=x&&NXT(x,i);if(a&&a[1]==="tadv"){if(x.s===1){x.tif=isoD(new Date());x.pr=null}x.s++;n++}});TFS.clear();log(`Étape validée pour ${n} parcelle(s)`);toast(n?n+" parcelle(s) validée(s)":"Aucune étape validable dans la sélection");render()},
pcedit:i=>{const x=PARC[+i],tr=x.pts.length>2;M(`<h2>Modifier la parcelle</h2><label>Nom<input id="cn" value="${x.n}"></label><label>Superficie déclarée (ha)<input id="ch" type="number" step="0.1" value="${x.ha}" ${tr?"disabled":""}></label>${tr?'<div class="sm mu">Superficie mesurée par l\'Agt/S-T : non modifiable.</div>':""}<div class="row"><button class="b" data-a="pcesv" data-v="${i}">Enregistrer</button><button class="b s" data-a="mc">Annuler</button></div>`)},
pcesv:i=>{const x=PARC[+i];x.n=$("#cn").value||x.n;if(!(x.pts.length>2))x.ha=+$("#ch").value||x.ha;P[x.p][6]=+PARC.filter(y=>y.p===x.p).reduce((t,y)=>t+y.ha,0).toFixed(1);log("Parcelle modifiée : "+pn(x.p));M("");render()},
pcdel:i=>M(`<h2>Supprimer la parcelle ?</h2><div class="mu">${pn(PARC[+i].p)} · ${PARC[+i].n}. Les missions liées seront supprimées.</div><div class="row"><button class="b" data-a="pcdel2" data-v="${i}">Supprimer</button><button class="b s" data-a="mc">Annuler</button></div>`),
pcdel2:i=>{i=+i;const x=PARC[i];for(let k=MIS.length-1;k>=0;k--){if(MIS[k].pc===i)MIS.splice(k,1);else if(MIS[k].pc>i)MIS[k].pc--}PARC.splice(i,1);TFS.clear();DLM=[];P[x.p][6]=+PARC.filter(y=>y.p===x.p).reduce((t,y)=>t+y.ha,0).toFixed(1);log("Parcelle supprimée");M("");render()},
mval:i=>{const m=MIS[+i];if(!can("trans")||m.dv)return;m.dv=1;log(`Livraison validée · ${pn(PARC[m.pc].p)}`);toast(off?"Hors ligne : validation en file d'attente":"Livraison validée · l'Agt/Pesage est notifié");render()},
notif:()=>{const T=tasks();M(`<h2>Mes tâches à faire</h2><div class="mu">${R[role][0]}</div>${T.length?T.slice(0,30).map(t=>`<div class="al"><span>${t[0]} ${t[1]}</span><button class="b s z" data-a="gon" data-v="${t[2]}">Ouvrir</button></div>`).join(""):'<div class="c mu">Aucune tâche en attente.</div>'}<button class="b s" data-a="mc">Fermer</button>`)},
gon:v=>{M("");X.go(v)},
ynew:()=>M(`<h2>Ajouter une année</h2><label>Année<input id="yn" type="number" min="2000" max="2100" value="${+CY+1}"></label><div class="mu">Une année plus récente devient la campagne en cours : les compteurs reçu et livré repartent à zéro, l'historique est conservé.</div><div class="row"><button class="b" data-a="ynsv">Ajouter</button><button class="b s" data-a="mc">Annuler</button></div>`),
ynsv:()=>{const y=String(+$("#yn").value);if(!/^20\d\d$/.test(y)||YRS.includes(y))return toast("Année invalide ou déjà présente.");YRS.push(y);YRS.sort();P.forEach(p=>{p[8]=p[8]||{};if(y>CY){p[8][CY]=[p[4],p[5]];p[4]=0;p[5]=0}p[8][y]=[p[4],p[5]]});if(y>CY)CY=y;py=y;log("Année ajoutée : "+y);toast("Année "+y+" ajoutée");M("");render()},
bsv:()=>{if(!can("param"))return;NOM=$("#bn").value.trim()||NOM;COL={pr:$("#bc1").value,ac:$("#bc2").value,sb:$("#bc3").value};try{localStorage.setItem("pfbrand",JSON.stringify({n:NOM,l:LOGO,c:COL}))}catch(e){}applyBrand();log("Identité de l'entreprise mise à jour : "+NOM);toast("Identité enregistrée");render()},
bre:()=>{if(!can("param"))return;NOM=" Blue Skies Bénin ";LOGO="";COL={pr:"",ac:"",sb:""};try{localStorage.removeItem("pfbrand")}catch(e){}applyBrand();log("Identité réinitialisée");toast("Identité par défaut rétablie");render()},
blrs:()=>{LOGO="";render()},
pxset:()=>{if(!can("prix"))return;PRIX=+$("#pxk").value>0?+$("#pxk").value:PRIX;TXD=+$("#txd").value>=0?+$("#txd").value:TXD;log(`Prix du kg : ${f(PRIX)} F · taux par défaut : ${TXD} %`);toast("Paramètres enregistrés");render()}});
const arv=()=>{const el=$("#ar");if(!el)return;const e=+$("#ae").value||0,t=+$("#at").value||0;el.innerHTML=`À rembourser : <b>${f(e*(1+t/100))} F</b> <span class="sm mu">(intrants ${f(e)} F + ${t} %)</span>`};
document.addEventListener("input",e=>{const id=e.target.id||"";if(id==="tfq"){tfq=e.target.value;tfp=1;$("#tfr").innerHTML=tfBody()}if(id==="ae"||id==="at")arv()});
document.addEventListener("change",e=>{const t=e.target,id=t.id;if(id==="tfg"){tfg=t.value;tfp=1;render()}if(id==="tfo"){tfo=t.value;tfp=1;render()}if(id==="zn"){zn=+t.value;tfp=1;render()}});
document.addEventListener("change",e=>{const t=e.target;if(t.id&&t.id.startsWith("za")&&ZN[+t.id.slice(2)]){ZN[+t.id.slice(2)].ag=+t.value;log("Zone "+ZN[+t.id.slice(2)].n+" affectée à "+AGN[+t.value]);toast("Affectation enregistrée");render()}if(t.id==="blg"&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{try{const c=document.createElement("canvas"),k=Math.min(1,160/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);LOGO=c.toDataURL("image/png")}catch(x){LOGO=r.result}render()};im.onerror=()=>{LOGO=r.result;render()};im.src=r.result};r.readAsDataURL(t.files[0])}});
render();
